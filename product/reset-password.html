<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src https://uouolfdzpipiwjqxodmz.supabase.co; img-src 'self'; style-src 'self'; script-src 'self'; base-uri 'none'; form-action 'self'">
    <title>GPT 知识库 - 重置密码</title>
    <link rel="icon" href="../assets/icons/icon32.png" sizes="32x32">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="auth-page">
    <header class="site-header auth-header">
      <a class="brand" href="./" aria-label="返回 GPT 知识库">
        <img src="../assets/gpt-knowledge-base-icon.svg" alt="" width="40" height="40">
        <span>GPT 知识库</span>
      </a>
    </header>

    <main class="auth-main">
      <section class="auth-surface" aria-labelledby="reset-title">
        <p class="eyebrow">Cloud account</p>
        <h1 id="reset-title">重置密码</h1>
        <p id="reset-description">为你的 GPT 知识库云账户设置一个至少 8 位的新密码。</p>
        <form id="resetPasswordForm">
          <label id="new-password-label" for="newPassword">新密码</label>
          <input id="newPassword" type="password" minlength="8" autocomplete="new-password" required>
          <label id="confirm-password-label" for="confirmPassword">再次输入</label>
          <input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required>
          <button id="savePasswordButton" type="submit">保存新密码</button>
        </form>
        <p id="resetPasswordStatus" class="auth-status" role="status" aria-live="polite"></p>
        <a id="reset-return" class="auth-return" href="./">返回产品页</a>
      </section>
    </main>

    <script src="auth-config.js"></script>
    <script src="reset-password.js"></script>
  </body>
</html>
