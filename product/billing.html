<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>GPT 知识库 - 安全结账</title>
    <link rel="icon" href="../assets/icons/icon32.png" sizes="32x32">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="billing-page">
    <header class="site-header billing-header">
      <a class="brand" href="./" aria-label="返回 GPT 知识库">
        <img src="../assets/gpt-knowledge-base-icon.svg" alt="" width="40" height="40">
        <span>GPT 知识库</span>
      </a>
    </header>

    <main class="billing-main">
      <section class="billing-surface" aria-labelledby="billing-title">
        <p class="eyebrow">Secure checkout</p>
        <h1 id="billing-title">订阅 GPT 知识库云空间</h1>
        <p id="billing-status">正在连接 Paddle 安全结账...</p>
        <div id="billing-progress" class="billing-progress" aria-hidden="true"><span></span></div>
        <p class="billing-note">银行卡、支付宝等付款信息由 Paddle 直接处理，GPT 知识库不会读取或保存你的银行卡号。</p>
        <div class="billing-actions">
          <button id="retryCheckoutButton" type="button" hidden>重新打开结账</button>
          <a href="./">返回产品页</a>
        </div>
      </section>
    </main>

    <script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
    <script src="billing-config.js"></script>
    <script src="billing.js"></script>
  </body>
</html>
